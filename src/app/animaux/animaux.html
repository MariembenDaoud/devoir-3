<div class="container mt-4">
  <h2 class="mb-4">Liste des animaux</h2>

  <table class="table table-bordered table-striped align-middle">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Espèce</th>
        <th>Âge</th>
        <th>Date de naissance</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let animal of animaux">
        <td>{{ animal.idAnimal }}</td>
        <td>{{ animal.nomAnimal }}</td>
        <td>{{ animal.espece }}</td>
        <td>{{ animal.age }}</td>
        <td>{{ animal.dateNaissance | date: 'dd/MM/yyyy' }}</td>
        <td class="text-nowrap">
          <button
            type="button"
            class="btn btn-warning btn-sm me-2"
            (click)="modifierAnimal(animal)"
          >
            Modifier
          </button>

          <button
            type="button"
            class="btn btn-danger btn-sm"
            (click)="supprimerAnimal(animal.idAnimal)"
          >
            Supprimer
          </button>
        </td>
      </tr>

      <tr *ngIf="animaux.length === 0">
        <td colspan="6" class="text-center">Aucun animal trouvé.</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="animalSelectionne as animal" class="card mt-4 mb-4">
    <div class="card-header">
      <h3>Modifier un animal</h3>
    </div>

    <div class="card-body">
      <form #formModification="ngForm" (ngSubmit)="enregistrerModification()">
        <div class="mb-3">
          <label for="idAnimal" class="form-label">ID Animal</label>
          <input
            id="idAnimal"
            type="number"
            class="form-control"
            [(ngModel)]="animal.idAnimal"
            name="idAnimal"
            readonly
          />
        </div>

        <div class="mb-3">
          <label for="nomAnimal" class="form-label">Nom Animal</label>
          <input
            id="nomAnimal"
            type="text"
            class="form-control"
            [(ngModel)]="animal.nomAnimal"
            name="nomAnimal"
            required
          />
        </div>

        <div class="mb-3">
          <label for="espece" class="form-label">Espèce</label>
          <input
            id="espece"
            type="text"
            class="form-control"
            [(ngModel)]="animal.espece"
            name="espece"
            required
          />
        </div>

        <div class="mb-3">
          <label for="age" class="form-label">Âge</label>
          <input
            id="age"
            type="number"
            class="form-control"
            [(ngModel)]="animal.age"
            name="age"
            min="0"
            required
          />
        </div>

        <div class="mb-3">
          <label for="dateNaissance" class="form-label"> Date de naissance </label>
          <input
            id="dateNaissance"
            type="date"
            class="form-control"
            [ngModel]="animal.dateNaissance | date: 'yyyy-MM-dd'"
            (ngModelChange)="changerDateNaissance($event)"
            name="dateNaissance"
            required
          />
        </div>

        <button type="submit" class="btn btn-success me-2" [disabled]="formModification.invalid">
          Enregistrer
        </button>

        <button type="button" class="btn btn-secondary" (click)="annulerModification()">
          Annuler
        </button>
      </form>
    </div>
  </div>
</div>
