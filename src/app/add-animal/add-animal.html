<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h2 class="mb-0">Ajouter un animal</h2>
    </div>

    <div class="card-body">
      <form #animalForm="ngForm" (ngSubmit)="addAnimal()">
        <div class="mb-3">
          <label for="idAnimal" class="form-label">ID Animal</label>
          <input
            id="idAnimal"
            type="number"
            class="form-control"
            [(ngModel)]="newAnimal.idAnimal"
            name="idAnimal"
            min="1"
            required
          />
        </div>

        <div class="mb-3">
          <label for="nomAnimal" class="form-label">Nom Animal</label>
          <input
            id="nomAnimal"
            type="text"
            class="form-control"
            [(ngModel)]="newAnimal.nomAnimal"
            name="nomAnimal"
            required
          />
        </div>

        <div class="mb-3">
          <label for="espece" class="form-label">Espèce</label>
          <input
            id="espece"
            type="text"
            class="form-control"
            [(ngModel)]="newAnimal.espece"
            name="espece"
            required
          />
        </div>

        <div class="mb-3">
          <label for="age" class="form-label">Âge</label>
          <input
            id="age"
            type="number"
            class="form-control"
            [(ngModel)]="newAnimal.age"
            name="age"
            min="0"
            required
          />
        </div>

        <div class="mb-3">
          <label for="dateNaissance" class="form-label"> Date de naissance </label>
          <input
            id="dateNaissance"
            type="date"
            class="form-control"
            [ngModel]="newAnimal.dateNaissance | date: 'yyyy-MM-dd'"
            (ngModelChange)="changerDateNaissance($event)"
            name="dateNaissance"
            required
          />
        </div>

        <button type="submit" class="btn btn-success me-2" [disabled]="animalForm.invalid">
          Ajouter
        </button>

        <a routerLink="/animaux" class="btn btn-secondary"> Retour à la liste </a>
      </form>
    </div>
  </div>
</div>
